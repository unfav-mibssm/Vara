<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skribbl Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="screen active" id="loginScreen">
        <div class="login-box">
            <h1 style="color: #764ba2; margin-bottom: 10px;">🎨 Skribbl Pro</h1>
            <p style="color: #666; margin-bottom: 20px;">Join a room to start drawing!</p>
            
            <input type="text" id="playerName" placeholder="Enter Nickname" maxlength="12" 
                style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 12px; border: 2px solid #ddd; outline: none;">
            
            <input type="text" id="roomCode" placeholder="Room Name (e.g. Party)" 
                style="width: 100%; padding: 12px; margin-bottom: 25px; border-radius: 12px; border: 2px solid #ddd; outline: none;">
            
            <button onclick="joinGame()" 
                style="width: 100%; padding: 15px; background: #764ba2; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px;">
                ENTER GAME
            </button>
        </div>
    </div>

    <div class="screen" id="gameScreen">
        <div class="top-bar">
            <div id="roundIndicator" style="font-weight: bold; font-size: 14px; opacity: 0.9;">ROUND 1 / 10</div>
            <div class="timer" id="timer">80</div>
            <div class="word-display" id="wordDisplay">_ _ _ _ _</div>
            <button onclick="location.reload()" style="background:none; border:1px solid #fff; color:#fff; padding:4px 8px; border-radius:4px; cursor:pointer;">Exit</button>
        </div>

        <div class="canvas-section">
            <canvas id="gameCanvas"></canvas>
            
            <div class="toolbar-container" id="painterControls" style="display: none;">
                <div class="popup" id="colorPopup">
                    <div class="color-opt" style="background: #000000;" onclick="setColor('#000000')"></div>
                    <div class="color-opt" style="background: #e74c3c;" onclick="setColor('#e74c3c')"></div>
                    <div class="color-opt" style="background: #3498db;" onclick="setColor('#3498db')"></div>
                    <div class="color-opt" style="background: #2ecc71;" onclick="setColor('#2ecc71')"></div>
                    <div class="color-opt" style="background: #f1c40f;" onclick="setColor('#f1c40f')"></div>
                </div>

                <div class="toolbar" id="mainToolbar">
                    <button class="tool-btn" onclick="document.getElementById('mainToolbar').classList.toggle('expanded')">⚙️</button>
                    <button class="tool-btn active" id="btnBrush" onclick="setTool('brush')">✏️</button>
                    <button class="tool-btn" id="btnBucket" onclick="setTool('bucket')">🪣</button>
                    <button class="tool-btn" onclick="toggleColors()">🎨</button>
                    <button class="tool-btn" onclick="clearCanvas()">🗑️</button>
                </div>
            </div>

            <div id="drawerStatus" style="position: absolute; top: 15px; left: 15px; background: #f39c12; color: white; padding: 6px 15px; border-radius: 20px; font-weight: bold; display: none;">
                ✏️ YOU ARE THE ARTIST
            </div>
        </div>

        <div class="bottom-section">
            <div class="players-panel" id="playerList">
                </div>
            <div class="chat-panel">
                <div class="chat-messages" id="chatMsgs"></div>
                <div style="padding: 10px; border-top: 1px solid #eee;">
                    <input type="text" id="chatInput" placeholder="Guess the word..." onkeypress="handleChat(event)"
                        style="width: 100%; padding: 12px 18px; border-radius: 25px; border: 2px solid #eee; outline: none;">
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="wordModal">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px;">Pick a word to draw:</h2>
            <div id="wordChoices" style="display: flex; flex-direction: column; gap: 12px;">
                </div>
        </div>
    </div>

    <div class="modal" id="gameOverModal">
        <div class="modal-content">
            <h1 style="color: #764ba2; margin-bottom: 10px;">🏆 GAME OVER</h1>
            <div class="podium" id="podium">
                </div>
            <div id="finalScoreList" style="margin-bottom: 25px; max-height: 120px; overflow-y: auto;"></div>
            <button onclick="location.reload()" style="padding: 15px 40px; background: #764ba2; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer;">
                PLAY AGAIN
            </button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <script src="words.js"></script>
    <script src="game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skribbl Replica Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="login-screen">
        <div class="login-inner">
            <h1 style="color: #0046be; margin-bottom: 10px;">🎨 Skribbl Clone</h1>
            <p style="color: #666; font-size: 14px;">Enter your name to join the room</p>
            
            <input type="text" id="username" placeholder="Enter Nickname" maxlength="12">
            
            <button class="play-btn" onclick="enterGame()">PLAY!</button>
            <p style="margin-top: 15px; font-size: 11px; color: #999;">Make sure Firebase Rules are set to True</p>
        </div>
    </div>

    <div id="top-half">
        <div id="info-bar">
            <div id="timer">80</div>
            
            <div id="word-display">WAITING...</div>
            
            <div style="font-weight: bold; color: #333;">
                ROUND <span id="round-count">1</span> / 10
            </div>
        </div>

        <canvas id="paint-canvas"></canvas>
    </div>

    <div id="bottom-half">
        
        <div id="player-sidebar">
            </div>

        <div id="chat-container">
            <div id="chat-msgs">
                <div style="color: #888; font-style: italic;">Welcome to the room!</div>
            </div>
            
            <input type="text" id="chat-input" placeholder="Type your guess here..." onkeypress="handleInput(event)">
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script src="firebase-config.js"></script>

    <script src="words.js"></script>

    <script src="game.js"></script>

</body>
</html>
